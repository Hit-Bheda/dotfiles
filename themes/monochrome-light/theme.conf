# Monochrome Light — the light counterpart to Monochrome.
#
# Same neutral greyscale ramp, inverted: light surfaces with dark text and a
# near-black accent. Status colours step from darkest (urgent/error) to
# lightest (info) instead of changing hue.
#
#     theme-apply monochrome-light
#
# See themes/README.md for every key and for per-theme template overrides.

name            = Monochrome Light
dark            = 0

# ── GTK / icons / cursors ──────────────────────────────────────────────
gtk_theme       = Adwaita
icon_theme      = Tela-grey-light
cursor_theme    = default
cursor_size     = 24
font            = Adwaita Sans 11

# ── Qt / KDE ───────────────────────────────────────────────────────────
# Kvantum theme name (used only when Kvantum is installed).
kvantum_theme   = Kvantum

# ── Palette ────────────────────────────────────────────────────────────
bg              = #f7f7f7
bg_alt          = #ededed
surface         = #ffffff
overlay         = #e2e2e2
border          = #c9c9c9
fg              = #121212
fg_dim          = #5c5c5c
muted           = #9a9a9a
accent          = #1c1c1c
accent2         = #5e5e5e
accent_fg       = #f7f7f7
red             = #0a0a0a
orange          = #2e2e2e
green           = #505050
blue            = #737373
