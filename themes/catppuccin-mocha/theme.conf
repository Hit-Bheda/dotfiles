# Catppuccin Mocha — the pastel dark theme.
#
# Palette from https://catppuccin.com/palette (Mocha flavour).
#
#     theme-apply catppuccin-mocha
#
# See themes/README.md for every key and for per-theme template overrides.

name            = Catppuccin Mocha
dark            = 1

# ── GTK / icons / cursors ──────────────────────────────────────────────
gtk_theme       = Adwaita-dark
icon_theme      = Tela-dracula-dark
cursor_theme    = default
cursor_size     = 24
font            = Adwaita Sans 11

# ── Qt / KDE ───────────────────────────────────────────────────────────
# Kvantum theme name (used only when Kvantum is installed).
kvantum_theme   = Kvantum

# ── Palette ────────────────────────────────────────────────────────────
bg              = #1e1e2e
bg_alt          = #181825
surface         = #313244
overlay         = #45475a
border          = #585b70
fg              = #cdd6f4
fg_dim          = #a6adc8
muted           = #6c7086
accent          = #cba6f7
accent2         = #74c7ec
accent_fg       = #1e1e2e
red             = #f38ba8
orange          = #fab387
green           = #a6e3a1
blue            = #89b4fa
