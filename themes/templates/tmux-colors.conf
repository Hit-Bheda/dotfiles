# Generated by `theme-apply` from themes/{{theme}}/theme.conf.
# Do not edit by hand: change the palette in the theme instead.

set -g status-style "bg={{bg}},fg={{fg_dim}}"
set -g status-left "#[fg={{accent_fg}},bg={{accent}},bold] #S #[bg={{bg}},fg={{fg_dim}}] "
set -g status-right "#[fg={{accent}}]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg={{muted}}]#h "

set -g window-status-format "#[fg={{muted}}] #I:#W "
set -g window-status-current-format "#[fg={{accent}},bold] #I:#W "
set -g window-status-activity-style "fg={{accent}},bg={{bg}}"
set -g window-status-bell-style "fg={{red}},bg={{bg}}"

set -g pane-border-style "fg={{border}}"
set -g pane-active-border-style "fg={{accent}}"

set -g message-style "bg={{bg}},fg={{accent}}"
set -g message-command-style "bg={{bg}},fg={{accent}}"
set -g mode-style "bg={{accent}},fg={{accent_fg}}"
setw -g clock-mode-colour "{{accent}}"

setw -g copy-mode-match-style "bg={{overlay}},fg={{fg}}"
setw -g copy-mode-current-match-style "bg={{accent}},fg={{accent_fg}}"
