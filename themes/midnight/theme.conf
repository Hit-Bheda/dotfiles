# Midnight — the default dark theme.
#
# Everything here is a plain `key = value` line. Copy this folder to
# themes/<your-theme>/theme.conf, change the values, and run:
#
#     theme-apply <your-theme>
#
# Optional: drop a file with the same name as a template into
# themes/<your-theme>/ to override just that file (see themes/README.md).

name            = Midnight
dark            = 1

# ── GTK / icons / cursors ──────────────────────────────────────────────
gtk_theme       = Adwaita-dark
icon_theme      = Tela-dark
cursor_theme    = default
cursor_size     = 24
font            = Adwaita Sans 11

# ── Qt / KDE ───────────────────────────────────────────────────────────
# Kvantum theme name (used only when Kvantum is installed).
kvantum_theme   = Kvantum

# ── Palette ────────────────────────────────────────────────────────────
bg              = #0a0c12
bg_alt          = #12141c
surface         = #1b1f2b
overlay         = #232838
border          = #2b3145
fg              = #c0caf5
fg_dim          = #8b93b5
muted           = #4a5068
accent          = #33ccff
accent2         = #7aa2f7
accent_fg       = #0a0c12
red             = #f7768e
orange          = #e0af68
green           = #9ece6a
blue            = #7aa2f7
