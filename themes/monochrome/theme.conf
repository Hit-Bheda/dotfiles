# Monochrome — a neutral greyscale theme.
#
# Every colour is a pure neutral grey (no hue), so the whole desktop stays
# monochromatic. Status colours step through lightness instead of hue:
# red is the brightest (urgent/error), blue the dimmest.
#
#     theme-apply monochrome
#
# See themes/README.md for every key and for per-theme template overrides.

name            = Monochrome
dark            = 1

# ── GTK / icons / cursors ──────────────────────────────────────────────
gtk_theme       = Adwaita-dark
icon_theme      = Tela-grey-dark
cursor_theme    = default
cursor_size     = 24
font            = Adwaita Sans 11

# ── Qt / KDE ───────────────────────────────────────────────────────────
# Kvantum theme name (used only when Kvantum is installed).
kvantum_theme   = Kvantum

# ── Palette ────────────────────────────────────────────────────────────
bg              = #0b0b0b
bg_alt          = #121212
surface         = #191919
overlay         = #222222
border          = #303030
fg              = #ededed
fg_dim          = #a0a0a0
muted           = #565656
accent          = #e0e0e0
accent2         = #7a7a7a
accent_fg       = #0b0b0b
red             = #f5f5f5
orange          = #d6d6d6
green           = #b8b8b8
blue            = #9a9a9a
