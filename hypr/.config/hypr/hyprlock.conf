# Hyprlock — Minimal monochrome black & white theme.

# >>> theme colors (managed by theme-apply)
$hl_accent   = rgba(224,224,224, 1.0)
$hl_accent2  = rgba(122,122,122, 1.0)
$hl_bg       = rgba(11,11,11, 1.0)
$hl_surface  = rgba(25,25,25, 0.65)
$hl_fg       = rgba(237,237,237, 1.0)
$hl_fg_dim   = rgba(160,160,160, 0.85)
$hl_danger   = rgba(245,245,245, 1.0)
# <<< theme colors

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = $hl_bg
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.0
}

# Clock
label {
    monitor =
    text = $TIME
    color = $hl_fg
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    position = 0, 210
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $hl_accent
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# User
label {
    monitor =
    text = $USER
    color = $hl_fg_dim
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    position = 0, -110
    halign = center
    valign = center
    rounding = 0
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    hide_input = false
    outer_color = $hl_accent
    inner_color = $hl_surface
    font_color = $hl_fg
    check_color = $hl_accent
    fail_color = $hl_danger
    placeholder_text = Enter password…
    fail_text = <i>Wrong password</i>
}
