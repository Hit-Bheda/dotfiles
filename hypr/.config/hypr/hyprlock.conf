# Hyprlock — lock screen themed to match the Hyprland/rofi look.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = rgba(10, 12, 18, 1.0)
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.2
}

# Clock
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    position = 0, 210
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(51, 204, 255, 1.0)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Lock icon + user
label {
    monitor =
    text =  $USER
    color = rgba(192, 202, 245, 0.85)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    position = 0, -110
    halign = center
    valign = center
    rounding = 10
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    hide_input = false
    outer_color = rgba(51, 204, 255, 1.0)
    inner_color = rgba(10, 12, 18, 0.65)
    font_color = rgb(255, 255, 255)
    check_color = rgba(51, 204, 255, 1.0)
    fail_color = rgb(247, 118, 142)
    placeholder_text = <span foreground="#ffffff99">Enter password…</span>
    fail_text = <i>Wrong password</i>
}
