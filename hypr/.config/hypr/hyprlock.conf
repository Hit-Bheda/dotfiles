# Hyprlock — lock screen themed to match the Hyprland/rofi look.
#
# The colour block below is rewritten by `theme-apply` (see
# themes/<name>/theme.conf). Everything after it uses those variables, so you
# normally never need to touch this file.

# >>> theme colors (managed by theme-apply)
$hl_accent   = rgba(51,204,255, 1.0)
$hl_accent2  = rgba(122,162,247, 1.0)
$hl_bg       = rgba(10,12,18, 1.0)
$hl_surface  = rgba(27,31,43, 0.65)
$hl_fg       = rgba(192,202,245, 1.0)
$hl_fg_dim   = rgba(139,147,181, 0.85)
$hl_danger   = rgba(247,118,142, 1.0)
# <<< theme colors

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = $hl_bg
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.2
}

# Clock
label {
    monitor =
    text = $TIME
    color = $hl_fg
    font_size = 110
    font_family = JetBrainsMono Nerd Font
    position = 0, 210
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $hl_accent
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# User
label {
    monitor =
    text =  $USER
    color = $hl_fg_dim
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    position = 0, -110
    halign = center
    valign = center
    rounding = 10
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    hide_input = false
    outer_color = $hl_accent
    inner_color = $hl_surface
    font_color = $hl_fg
    check_color = $hl_accent
    fail_color = $hl_danger
    placeholder_text = <span foreground="$hl_fg_hex99">Enter password…</span>
    fail_text = <i>Wrong password</i>
}
