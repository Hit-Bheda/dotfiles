# Generated by `theme-apply` from themes/monochrome/theme.conf.
# Do not edit by hand: change the palette in the theme instead.

set -g status-style "bg=#0b0b0b,fg=#a0a0a0"
set -g status-left "#[fg=#0b0b0b,bg=#e0e0e0,bold] #S #[bg=#0b0b0b,fg=#a0a0a0] "
set -g status-right "#[fg=#e0e0e0]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#565656]#h "

set -g window-status-format "#[fg=#565656] #I:#W "
set -g window-status-current-format "#[fg=#e0e0e0,bold] #I:#W "
set -g window-status-activity-style "fg=#e0e0e0,bg=#0b0b0b"
set -g window-status-bell-style "fg=#f5f5f5,bg=#0b0b0b"

set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#e0e0e0"

set -g message-style "bg=#0b0b0b,fg=#e0e0e0"
set -g message-command-style "bg=#0b0b0b,fg=#e0e0e0"
set -g mode-style "bg=#e0e0e0,fg=#0b0b0b"
setw -g clock-mode-colour "#e0e0e0"

setw -g copy-mode-match-style "bg=#222222,fg=#ededed"
setw -g copy-mode-current-match-style "bg=#e0e0e0,fg=#0b0b0b"
